[project]
name = "parser-ostatkov"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=22.0,<23",
    "rarfile>=4.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=8.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

# Ruff: линтер/форматтер от Astral. Читает этот блок и локально (`uvx ruff`), и в CI.
[tool.ruff]
target-version = "py312"
# 88 мало для русских docstring/логов; 120 закрывает текущие E501 без переноса текстов.
line-length = 120
exclude = [
    ".venv",
    "storage",
    "temp",
    ".git",
]

[tool.ruff.lint]
select = ["E", "F", "I", "PIE"]

# mypy: без stubs у openpyxl/rarfile/apscheduler; строгие arg-type всё ещё ловим.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
