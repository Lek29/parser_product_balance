[project]
name = "parser-ostatkov"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=22.0,<23",
    "rarfile>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

# Ruff: линтер/форматтер от Astral. Читает этот блок и локально (`uvx ruff`), и в CI.
[tool.ruff]
target-version = "py312"
exclude = [
    ".venv",
    "storage",
    "temp",
    ".git",
]

# Дефолтный набор Ruff (E4/E7/E9 + F). Не раздуваем select, пока CI зелёный.
# Позже можно добавить: "I" (imports), "UP" (pyupgrade), "B" (bugbear).
[tool.ruff.lint]
