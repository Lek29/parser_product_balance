# CI: проверка Python-кода линтером Ruff при каждом пуше в main.
name: CI

# Когда запускать пайплайн: только push в ветку main.
on:
  push:
    branches:
      - main

jobs:
  # Одна простая job: скачать код, поставить uv, прогнать ruff.
  lint:
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: скачать код репозитория в рабочую директорию раннера.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2: установить uv (официальный action от Astral) и добавить его в PATH.
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Шаг 3: проверить код Ruff через uvx (сам скачает и запустит ruff, без uv sync).
      - name: Run Ruff linter
        run: uvx ruff check .

  deploy:
    name: Deploy to VPS
    needs: lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /opt/projects/fanat_product_balance
            git pull origin main
            docker compose up --build -d