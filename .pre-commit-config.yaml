repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9  # укажите актуальную версию
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # mypy запускается в изоляции, поэтому здесь нужно указывать 
        # сторонние библиотеки, которые требуют типизации
        additional_dependencies: [ types-requests ]