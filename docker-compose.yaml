services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: parser-ostatkov-bot:latest
    container_name: parser-ostatkov-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Moscow
    # Лимиты для обычного `docker compose up` (не Swarm).
    # В Swarm-режиме используйте блок deploy ниже.
    cpus: 0.25
    mem_limit: 128m
    mem_reservation: 64m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M
    volumes:
      - ./storage:/app/storage
      - ./temp:/app/temp
    init: true
    stop_grace_period: 45s
