services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: parser-ostatkov-bot:latest
    container_name: parser-ostatkov-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Moscow
    volumes:
      - ./storage:/app/storage
      - ./temp:/app/temp
    init: true
    stop_grace_period: 45s
