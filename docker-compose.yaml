services:
  bot:
    image: ghcr.io/lek29/parser_product_balance:latest
    container_name: parser-ostatkov-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Moscow
    cpus: 0.25
    mem_limit: 128m
    mem_reservation: 64m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M
    volumes:
      - ./storage:/app/storage
      - ./temp:/app/temp
    init: true
    stop_grace_period: 45s
